name: Blogin 365 AI Holdings 24/7 Autonomous Publisher

on:
  schedule:
    # 09:00 KST (00:00 UTC)
    - cron: '0 0 * * *'
    # 15:00 KST (06:00 UTC)
    - cron: '0 6 * * *'
    # 21:00 KST (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autonomous-publish:
    name: 🚀 Autonomous Quant Strategy & FinTech Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Browsers (Chromium)
        run: |
          playwright install --with-deps chromium

      - name: 🔐 Bootstrap OAuth & Environment Secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || '2002031376804677477' }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX || '863c2f0c96b064551' }}
          IS_ADSENSE_APPROVED: ${{ secrets.IS_ADSENSE_APPROVED || 'false' }}
          BLOGGER_CREDENTIALS_JSON: ${{ secrets.BLOGGER_CREDENTIALS_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          python scripts/bootstrap_ci_secrets.py

      - name: ⚡ Execute Autonomous Publisher Cycle (--once)
        run: |
          python engine/company_runtime.py --once

      - name: 💾 Commit & Push Updated Strategy Queue & Logs
        run: |
          git config --global user.name "Blogin365 AI Holdings"
          git config --global user.email "bot@blogin365ai.blogspot.com"
          git add data/strategy_topics_queue.json data/company_logs.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): daily strategy lab publishing completed [skip ci]"
            git push origin main
          else
            echo "No queue or log changes to commit."
          fi

      - name: 🧹 Cleanup Runner Secrets
        if: always()
        run: |
          rm -f credentials.json token.json SEO.env
